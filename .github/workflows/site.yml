# The public website vitkirunor.se on GitHub Pages: the start page and the articles, built as static files. The app
# itself runs on the researcher's own computer and is not part of the website, so its pages are left out of the build.
# The articles come from web/content/articles.json and web/public/figurer/: the articles that have gone live, exported
# and pushed by the local app when an article is published or changed, or when a scheduled article's time comes
# (src/site_export.py).
name: Webbplatsen

on:
  push:
    branches: [main]
    paths: ["web/**", "CITATION.cff", ".github/workflows/site.yml"]
  workflow_dispatch:

# Only the deploy job may publish to Pages: the build job runs the dependencies' code (npm ci, next build) and can
# only read the repository. The actions are pinned to commits (the version in the comment), since a tag can be moved.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Installera
        run: npm ci
        working-directory: web
      - name: Bara startsidan och artiklarna
        # The app's pages and API, and the app map's realm boundaries (public/geo), which no public page uses
        run: rm -rf "web/src/app/(app)" web/src/app/api web/src/app/indexnow-key.txt web/public/geo
      - name: Engelska texter för webbplatsens sidor
        # Only the catalog entries the public pages can show (src/i18n/public-catalog.mjs), from the current catalog
        run: npm run i18n:public
        working-directory: web
      - name: Bygg
        run: npx next build
        working-directory: web
        env:
          NEXT_PUBLIC_SITE_MODE: public
          NEXT_PUBLIC_SITE_URL: https://vitkirunor.se
          # The vote on the start page writes to this Firebase project (public; it is also in web/.firebaserc)
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: runes-1656b
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Engelska sidor på engelska
        # The English editions of the articles (/en/…) declare English as the page's language; the root layout is shared
        # with the Swedish pages and says Swedish
        run: find web/out/en -name '*.html' -exec sed -i 's/<html lang="sv"/<html lang="en"/' {} +
      - name: Säkerhetspolicyn först
        # The security policy (web/src/lib/site.ts SITE_CSP, set in app/layout.tsx) first in <head>, right after the
        # character set, so that it covers every script and stylesheet the page loads: React renders it after Next's tags
        run: find web/out -name '*.html' -exec perl -0pi -e 's{(<meta charSet="utf-8"/>)(.*?)(<meta http-equiv="Content-Security-Policy"[^>]*>)}{$1$3$2}s' {} +
      - name: Utan Jekyll
        run: touch web/out/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

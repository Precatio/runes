# Checks on every push and pull request to main: the web app's types and lint, the Python tests that can run in a
# clean checkout, and a vulnerability check of the locked Python dependencies. Nothing is published or deployed here
# (that is site.yml). The actions are pinned to commits (the version in the comment), since a tag can be moved.
#
# The Python tests run without R, without Firestore or Google credentials and without the large folders that are not
# in git (data/cache, data/raa, data/ortnamn, the Runor harvest): the tests that need them skip themselves when they are
# missing (the R tests through the needs_r/slow_r markers in tests/conftest.py, test_methods_numbers.py,
# test_places.py, test_runor.py). On the developer's machine, where R and the data exist, the same tests run in full.
name: Kontroller

on:
  push:
    branches: [main]
    # The local app's article exports alone (src/site_export.py) change no code; site.yml builds and type-checks them
    paths-ignore: ["web/content/**", "web/public/figurer/**", "web/public/artiklar-sok.json"]
  pull_request:
    branches: [main]
    paths-ignore: ["web/content/**", "web/public/figurer/**", "web/public/artiklar-sok.json"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Webbappen (typer och lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Installera
        run: npm ci --no-audit --no-fund
      - name: Typer
        run: npx tsc --noEmit -p .
      - name: Lint
        run: npx eslint src

  e2e:
    name: Webbappen i webbläsaren (röktester)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Installera
        run: npm ci --no-audit --no-fund
      - name: Chromium för Playwright
        run: npx playwright install --with-deps chromium
      - name: Röktester
        # playwright.config.ts builds and starts the app (webServer) and loads the start page, the article list, an
        # article in Swedish and English and the 3D page; an uncaught error in a page fails the test
        run: npx playwright test

  python:
    name: Python-testerna
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Same switches as tests/conftest.py, stated here too so nothing in CI reaches SGU, R or the website
      GEOLOGY_DISABLED: "1"
      R_DISABLED: "1"
      # Empty RSCRIPT = no R, even if the runner image has it: the R tests skip themselves (tests/conftest.py)
      RSCRIPT: ""
      WARM_CACHES: "0"
      R_AUTORUN: "0"
      SITE_PUBLISH: "0"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # The developer's .venv runs Python 3.13
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Installera (låsta versioner)
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Tester
        run: python -m pytest -q -p no:cacheprovider -rs --durations=15

  audit:
    name: Sårbarheter i Python-beroendena
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Installera pip-audit
        run: python -m pip install pip-audit==2.10.1
      - name: Granska requirements.lock
        # Fails on an advisory that has a fixed version (raise it in requirements.lock). An advisory without any fixed
        # release warns, unless it is in ACCEPTED below with the reason it does not apply here; those are notices.
        run: |
          pip-audit -r requirements.lock --disable-pip --progress-spinner off -f json -o audit.json || true
          python - <<'EOF'
          import json, sys
          deps = json.load(open("audit.json"))["dependencies"]
          # Advisories without a fix that have been judged not to apply (id: why), so that new ones still stand out
          ACCEPTED = {
              "PYSEC-2026-3740": "nltk is only a reference implementation in tests/test_runlm.py; the advisory concerns "
                                 "NLTK's parser model files, which are never loaded (judged 2026-10-22)",
          }
          fixable = 0
          for dep in deps:
              for v in dep.get("vulns", []):
                  fix = ", ".join(v["fix_versions"])
                  line = f'{dep["name"]} {dep["version"]}: {v["id"]} ' + (f"(fixed in {fix})" if fix else "(no fixed version yet)")
                  if not fix and v["id"] in ACCEPTED:
                      print(f"::notice::{line}; accepted: {ACCEPTED[v['id']]}")
                      continue
                  print(("::error::" if fix else "::warning::") + line)
                  fixable += bool(fix)
          print(f"{len(deps)} locked packages checked, {fixable} advisories with a fix")
          sys.exit(1 if fixable else 0)
          EOF

# Bluesky-kön (data/bluesky/ko.json) utan Viktors dator: ett inlägg tisdagar och fredagar från kl. 13 svensk tid
# (Viktor 2026-11-14; samma dagar som artiklarna, så dagens artikel går först), exakt som
# den lokala appen postar det (scripts/ci_bluesky.py → scripts/bluesky_post.py: länkkortet med den engelska
# delningsbilden, "credit" som svar), och posted/posted_at committas tillbaka till kön.
#
# GitHub-cron går i UTC: 11:07 är 13:07 på sommaren och 12:07 är 13:07 på vintern; skriptet kontrollerar själv att det
# är tisdag eller fredag, att klockan är minst 13 i Stockholm och att inget har postats i dag. 14:37 UTC tar igen en
# körning som GitHub hoppade över.
#
# Ofarligt innan det är påslaget: utan hemligheterna BLUESKY_HANDLE och BLUESKY_APP_PASSWORD, eller så länge
# data/bluesky/postning.json säger "postar": "lokal" (den lokala appen postar), skrivs bara en notis.
name: Bluesky-kön

on:
  schedule:
    - cron: "7 11 * * 2,5"
    - cron: "7 12 * * 2,5"
    - cron: "37 14 * * 2,5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bluesky
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # posted/posted_at back to ko.json
    steps:
      - name: Hemligheterna finns?
        id: guard
        env:
          HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          PW: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          if [ -z "$HANDLE" ] || [ -z "$PW" ]; then
            echo "::notice::Bluesky-postning i GitHub Actions är inte aktiverad än: hemligheterna BLUESKY_HANDLE och BLUESKY_APP_PASSWORD saknas (se ADMIN_PA_WEBBEN.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: steps.guard.outputs.enabled == 'true'
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.guard.outputs.enabled == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-publicera.txt
      - name: Installera (bara det postningen behöver)
        if: steps.guard.outputs.enabled == 'true'
        run: python -m pip install --require-hashes -r requirements-publicera.txt
      - name: Posta dagens inlägg
        id: post
        if: steps.guard.outputs.enabled == 'true'
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          BLUESKY_ARTICLES: site
          TZ: Europe/Stockholm
        run: python scripts/ci_bluesky.py
      - name: Committa kön
        if: steps.post.outputs.changed == 'true'
        run: |
          git add data/bluesky/ko.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Bluesky: dagens inlägg ur kön postat (GitHub Actions)" -- data/bluesky/ko.json
          # The post is out: the queue must record it, or tomorrow's run would not know. Someone may have pushed
          # meanwhile (a new queue item from the computer), so the commit is put on top and pushed again.
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main || { git rebase --abort; break; }
            sleep 5
          done
          echo "::error::Inlägget är postat men kön kunde inte pushas. Fyll i posted/posted_at i data/bluesky/ko.json för hand (adressen står i loggen ovan)."
          exit 1

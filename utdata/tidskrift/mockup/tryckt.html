<!doctype html>
<html lang="sv"><head><meta charset="utf-8">
<!-- Mockup: Korpus nr 1 som tryckt tidning (Viktor 2026-11-12). Renderas med Chrome headless till Korpus_nr1_tryckt.png. -->
<style>
:root { --rust: #b7410e; --ink: #1d2226; --mute: #5b646b;
  --serif: "Charter", "Iowan Old Style", Georgia, serif; --sans: "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
html, body { margin: 0; width: 1600px; height: 1000px; overflow: hidden; }
body { position: relative; font-family: var(--serif); color: var(--ink);
  background:
    radial-gradient(ellipse 900px 700px at 72% 55%, rgba(255,255,255,.55), rgba(255,255,255,0) 70%),
    linear-gradient(135deg, #e7e1d7 0%, #ddd5c8 55%, #d3cabb 100%); }
/* lätt pappers-/linnestruktur */
body::before { content: ""; position: absolute; inset: 0; opacity: .22;
  background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.035) 0 1px, transparent 1px 3px),
                    repeating-linear-gradient(90deg, rgba(0,0,0,.03) 0 1px, transparent 1px 4px); }

.text { position: absolute; left: 96px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
.flik { align-self: flex-start; background: var(--rust); color: #fff; font: 700 17px var(--sans); letter-spacing: .18em; text-transform: uppercase; padding: 9px 16px 8px; margin-bottom: 30px; }
h1 { font: 900 64px/1.06 var(--serif); margin: 0 0 30px; letter-spacing: -.01em; }
h1 em { font-style: normal; color: var(--rust); }
p { font: 400 27px/1.45 var(--sans); color: #39424a; margin: 0 0 34px; max-width: 520px; }
.kontakt { font: 700 19px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--ink); padding-top: 18px; border-top: 3px solid var(--rust); align-self: flex-start; }

/* uppslaget (s. 2–3) som ligger öppet under */
.uppslag { position: absolute; left: 700px; top: 150px; width: 1020px; height: 721px; display: flex;
  transform: rotate(-7deg); box-shadow: 0 30px 50px rgba(40,30,20,.28), 0 6px 14px rgba(40,30,20,.18); }
.uppslag img { width: 510px; height: 721px; display: block; }
.uppslag::after { content: ""; position: absolute; left: 470px; width: 80px; top: 0; bottom: 0;
  background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.10) 42%, rgba(0,0,0,.22) 50%, rgba(0,0,0,.08) 58%, rgba(0,0,0,0) 100%); }

/* den stängda tidningen överst */
.omslag { position: absolute; left: 760px; top: 108px; width: 560px; height: 792px; transform: rotate(5deg);
  box-shadow: 0 46px 70px rgba(40,30,20,.36), 0 12px 22px rgba(40,30,20,.22), -1px 0 0 rgba(0,0,0,.08); }
.omslag img { width: 100%; height: 100%; display: block; }
/* rygg (häftad) och ljusreflex */
.omslag::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 18px;
  background: linear-gradient(90deg, rgba(0,0,0,.20), rgba(255,255,255,.10) 45%, rgba(0,0,0,0)); }
.omslag::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(120deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 38%, rgba(0,0,0,0) 70%, rgba(0,0,0,.07) 100%); }
/* sidkanter under omslaget: tidningen har tjocklek */
.kant { position: absolute; left: 764px; top: 112px; width: 560px; height: 792px; transform: rotate(5deg) translate(4px, 4px);
  background: #f4f1ea; box-shadow: 0 0 0 1px rgba(0,0,0,.06); }
.kant2 { transform: rotate(5deg) translate(7px, 7px); background: #ebe7de; }
</style></head>
<body>
  <div class="uppslag"><img src="sida-02.jpg" alt=""><img src="sida-03.jpg" alt=""></div>
  <div class="kant kant2"></div>
  <div class="kant"></div>
  <div class="omslag"><img src="sida-01.jpg" alt="Korpus nr 1, omslaget"></div>

  <div class="text">
    <div class="flik">Nu i tryck</div>
    <h1>Korpus nr 1 finns även i <em>tryckta exemplar!</em></h1>
    <p>Hör gärna av er om ni vill ha den skickad till er.</p>
    <div class="kontakt">vitkirunor.se/kontakt</div>
  </div>
</body></html>
